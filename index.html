      justify-content: center;

      object-position: center center;

      margin-bottom: 1.35rem;

    .link-btn:active { transform: translateY(0) scale(0.99); }

    .foot {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(11,11,15,0.5);

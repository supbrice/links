    :root {

    body {

    html.light body {

    /* Ambient field: soft orbs + a slow wash. Motion is transform-only so it stays on the compositor. */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: linear-gradient(180deg, #05070c 0%, #090d14 48%, #05070b 100%);
    }
    html.light .ambient {
      background: linear-gradient(180deg, #f8fafc 0%, #e8eef6 48%, #f1f5f9 100%);
    }
    .ambient-wash,
    .orb {
      position: absolute;
      will-change: transform;
    }
    .ambient-wash {
      left: -30%;
      width: 160%;
      top: -30%;
      height: 90%;
      background: linear-gradient(
        115deg,
        transparent 8%,
        rgba(37, 99, 235, 0.22) 32%,
        rgba(147, 197, 253, 0.14) 52%,
        rgba(59, 130, 246, 0.24) 72%,
        transparent 94%
      );
      animation: ambient-wash 16s linear infinite alternate;
      animation-delay: -5s;
    }
    html.light .ambient-wash {
      background: linear-gradient(
        115deg,
        transparent 8%,
        rgba(59, 130, 246, 0.22) 30%,
        rgba(191, 219, 254, 0.55) 52%,
        rgba(96, 165, 250, 0.28) 74%,
        transparent 94%
      );
    }
    .orb {
      border-radius: 50%;
    }
    .orb-1 {
      width: 34vmax;
      height: 34vmax;
      left: -2%;
      top: 4%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.9) 0%, rgba(37, 99, 235, 0.32) 28%, transparent 58%);
      animation: drift-1 14s linear infinite alternate;
      animation-delay: -4s;
    }
    .orb-2 {
      width: 30vmax;
      height: 30vmax;
      right: -2%;
      bottom: 0;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.62) 0%, rgba(59, 130, 246, 0.18) 32%, transparent 60%);
      animation: drift-2 16s linear infinite alternate;
      animation-delay: -9s;
    }
    .orb-3 {
      width: 22vmax;
      height: 22vmax;
      right: 8%;
      top: 18%;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.7) 0%, rgba(29, 78, 216, 0.16) 34%, transparent 60%);
      animation: drift-3 12s linear infinite alternate;
      animation-delay: -3s;
    }
    html.light .orb-1 {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.42) 0%, rgba(59, 130, 246, 0.12) 38%, transparent 68%);
    }
    html.light .orb-2 {
      background: radial-gradient(circle, rgba(147, 197, 253, 0.8) 0%, rgba(96, 165, 250, 0.2) 40%, transparent 70%);
    }
    html.light .orb-3 {
      background: radial-gradient(circle, rgba(191, 219, 254, 0.9) 0%, rgba(59, 130, 246, 0.16) 44%, transparent 70%);
    }
    .ambient-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 42%, transparent 28%, rgba(5, 7, 12, 0.18) 78%, rgba(5, 7, 12, 0.42) 100%);
    }
    html.light .ambient-vignette {
      background: radial-gradient(ellipse at 50% 42%, transparent 30%, rgba(248, 250, 252, 0.1) 80%, rgba(241, 245, 249, 0.45) 100%);
    }
    @keyframes ambient-wash {
      from { transform: translate3d(-10%, -4%, 0); }
      to { transform: translate3d(10%, 12%, 0); }
    }
    @keyframes drift-1 {
      from { transform: translate3d(0, 0, 0) scale(0.94); }
      to { transform: translate3d(26vw, 22vh, 0) scale(1.16); }
    }
    @keyframes drift-2 {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-24vw, -20vh, 0) scale(1.18); }
    }
    @keyframes drift-3 {
      from { transform: translate3d(0, 0, 0) scale(0.9); }
      to { transform: translate3d(-18vw, 24vh, 0) scale(1.2); }
    }
    @media (max-width: 640px) {

      .orb-1 { width: 80vw; height: 80vw; }
      .orb-2 { width: 72vw; height: 72vw; }

    const toggle = document.getElementById('theme-toggle');

    function applyTheme(mode) {
      const isLight = mode === 'light';
      root.classList.toggle('light', isLight);
      root.classList.toggle('dark', !isLight);
      iconSun.classList.toggle('hidden', isLight);
      iconMoon.classList.toggle('hidden', !isLight);

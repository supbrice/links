      { title: 'PSN | bryzUSA', url: 'https://profile.playstation.com/bryzUSA' },
      { title: 'Discord Community 🌍', url: 'https://discord.gg/tFW36gZDKa' },
      { title: 'Reaction YT', url: 'https://www.youtube.com/@supbrice?sub_confirmation=1' },
      { title: 'Tech YT', url: 'https://www.youtube.com/@ReviewswBryz?sub_confirmation=1' },
      { title: '🇨🇲 237 USA', url: 'https://www.youtube.com/@237USA?sub_confirmation=1' },
      { title: 'Get a Free Stock – Join Robinhood Now!', url: 'https://join.robinhood.com/ngubric-48af9b' },
    ];

    const container = document.getElementById('links');
    links.forEach(({ title, url }) => {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'link-btn';
      a.textContent = title;
      a.setAttribute('role', 'listitem');
      container.appendChild(a);
    });

    // Theme: dark default; light via html.light
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const iconSun = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');

    function applyTheme(mode) {
      const isLight = mode === 'light';
      root.classList.toggle('light', isLight);
      root.classList.toggle('dark', !isLight);
      iconSun.classList.toggle('hidden', isLight);
      iconMoon.classList.toggle('hidden', !isLight);
      try { localStorage.setItem('theme', mode); } catch (_) {}
    }

    let saved = 'dark';
    try { saved = localStorage.getItem('theme') || 'dark'; } catch (_) {}
    applyTheme(saved === 'light' ? 'light' : 'dark');

    toggle.addEventListener('click', () => {
      const next = root.classList.contains('light') ? 'dark' : 'light';
      applyTheme(next);
    });
  </script>
